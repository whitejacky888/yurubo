{# 画面 5：見せる相手グループの一覧 #}
{% extends "base.html" %}
{% block title %}グループ｜ゆる募{% endblock %}
{% block content %}
  <h1>見せる相手グループ</h1>
  <p class="sub">募集は、ここで選んだグループの人にだけ見えます。</p>

  {% for grp in groups %}
    <a class="sticky" style="{{ sticky_style(grp.id) }}" href="{{ url_for('edit_group', group_id=grp.id) }}">
      <h3>{{ grp.name }}</h3>
      <p class="meta">👥 {{ grp.member_count }}人</p>
    </a>
  {% else %}
    <p class="empty">まだグループがありません。</p>
  {% endfor %}

  <a class="btn coral block" href="{{ url_for('new_group') }}">＋新しいグループを作る</a>
{% endblock %}
