{# 画面：ログイン（ステップ 2）認証コードの入力 #}
{% extends "base.html" %}
{% from "macros.html" import csrf_field %}
{% block title %}認証コード｜ゆる募{% endblock %}
{% block content %}
  <h1>認証コードを入力</h1>
  <p class="sub">{{ phone }} に届いた 6 桁のコードを入力してください。</p>
  <form method="post" class="card">
    {{ csrf_field() }}
    <label for="code">認証コード</label>
    {# inputmode="numeric" でスマホに数字キーボードを出します #}
    <input type="text" id="code" name="code" inputmode="numeric" maxlength="6" placeholder="123456" required autofocus>
    <button class="btn block">確認する</button>
  </form>
  <p class="center"><a href="{{ url_for('login') }}">電話番号を入れなおす</a></p>
{% endblock %}
